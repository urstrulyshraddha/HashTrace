[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hashtrace"
version = "1.0.0"
description = "Forensic file integrity engine & cryptographic hash generator"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Environment :: Console",
]

[project.scripts]
hashtrace = "hashtrace.cli:main"
hace = "hashtrace.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/hashtrace"
Issues = "https://github.com/your-username/hashtrace/issues"
